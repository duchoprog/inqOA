<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://cdn.jsdelivr.net/npm/docx@8.0.4/build/index.min.js"></script>

    <title>AIIF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>AIIF</h1>
      <div id="project-name-container">
        <label for="projectName-input">Project Name:</label>
        <input type="text" id="projectName-input" required />
      </div>
    </header>

    <main class="container">
      <section id="upload-section" class="side-by-side">
        <h2>Upload Files</h2>
        <input type="file" id="file-input" multiple />
        <div id="drop-area">
          <p>Drag & Drop files here</p>
        </div>
        <div id="file-list"></div>
      </section>

      <section id="content-section" class="side-by-side">
        <h2>Enter Content</h2>
        <form id="content-form">
          <div class="contentContainer">
            <label for="title-input">Title:</label>
            <input type="text" id="title-input" required />
          </div>
          <div class="contentContainer">
            <label for="content-input">Content:</label>
            <textarea id="content-input" rows="5" required></textarea>
          </div>
          <h3>Upload Pictures</h3>
          <input type="file" id="picture-input" multiple />
          <div id="drop-area">
            <p>Drag & Drop files here</p>
          </div>
          <div id="file-list"></div>
          <button type="submit" id="addContentButton">Add Content</button>
        </form>
        <div id="content-list"></div>
      </section>

      <section id="inquiry-section" class="side-by-side">
        <h2>Inquiry Sent</h2>
        <textarea id="inquiry-input" rows="8" required></textarea>
      </section>

      <section id="previousExcel" class="side-by-side">
        <h2>Previous Excel</h2>
        <input
          type="file"
          id="previous-file-input"
          multiple
          accept=".xlsx, .xls"
        />
        <div id="previous-drop-area">
          <p>Drag & Drop files here</p>
        </div>
        <div id="previous-file-list"></div>
      </section>
    </main>

    <div class="button-container">
      <button id="final-submit">Submit All Information</button>
    </div>

    <div class="spinnerContainer">
      <div class="loading-spinner"></div>
    </div>

    <footer>
      <div id="signature">
        Developed by
        <a href="mailto:duchoprog@gmail.com">duchoprog@gmail.com</a>
      </div>
    </footer>

    <script src="myscript.js"></script>
  </body>
</html>
